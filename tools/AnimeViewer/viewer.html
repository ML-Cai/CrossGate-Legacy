<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CGL Resource Studio · 動畫資源</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10161d;color:#e6edf4;font:14px system-ui}header{padding:12px 24px;border-bottom:1px solid #33404d}h1{margin:0;font-size:23px;font-weight:600}p{margin:8px 0;color:#aabccd}header p{margin:4px 0 0}main{max-width:1250px;padding:16px;margin:auto}.toolbar,.controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:12px}label{display:grid;gap:4px;color:#aabccd}select,button,input{font:inherit}select,button{padding:7px 10px;border:1px solid #435568;border-radius:7px;color:#e6edf4;background:#1e2a36}select{min-width:145px}button{cursor:pointer}button:hover:not(:disabled){border-color:#71c9ef}button:focus-visible,select:focus-visible{outline:2px solid #71c9ef;outline-offset:3px}button:disabled{opacity:.45;cursor:default}#status{white-space:pre-line;min-height:40px;color:#b6c9db}#error{color:#ffa9a0;min-height:18px}#error:empty{display:none}.stage,.direction-card canvas{background-color:#26303a;background-image:linear-gradient(45deg,#303e4a 25%,transparent 25%),linear-gradient(-45deg,#303e4a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#303e4a 75%),linear-gradient(-45deg,transparent 75%,#303e4a 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.stage{border:1px solid #435568;border-radius:12px;overflow:hidden;display:grid;place-items:center}#canvas{display:block;width:auto;height:clamp(180px,calc(100vh - 540px),420px);max-width:100%;object-fit:contain;image-rendering:pixelated}.stage-title{display:flex;justify-content:space-between;gap:20px;margin:8px 0;color:#b6c9db}#directions{display:grid;grid-template-columns:repeat(8,minmax(130px,1fr));overflow-x:auto;gap:10px;padding:6px 2px 12px;min-height:180px}.direction-card{padding:0 0 10px;min-width:130px;display:flex;flex-direction:column;align-items:center;gap:6px;overflow:hidden}.direction-card canvas{width:100%;height:auto;max-width:160px;image-rendering:pixelated}.direction-card[aria-pressed=true]{border-color:#73d1f5;box-shadow:0 0 0 2px #73d1f5}.direction-card small{font-size:11px;max-width:154px;overflow-wrap:anywhere;color:#a8bdcd}#frame{width:210px}.controls{align-items:center;margin:12px 0}.controls label{display:flex;align-items:center;gap:8px}main>p{font-size:12px;margin:4px 0 8px}#position{min-width:125px}#memory{font-size:12px;color:#829bb0}.badge{font-size:12px;color:#8dd5a8;margin-left:16px}
</style><script src="/playback.js" defer></script><script src="/viewer.js" defer></script></head>
<body><header><h1>CGL Resource Studio <span class="badge">唯讀預覽</span></h1><p>角色動畫 · Daytime／內嵌調色盤 · 大圖與全部方向同步播放</p></header>
<main><div class="toolbar"><label>資源版本<select id="version"><option value="0">Classic</option><option value="1">PUK1</option><option value="2">PUK2_V1</option><option value="3">PUK2_V2</option><option value="4">PUK3_V1</option><option value="5">PUK4_V1</option><option value="6">PUK4_V2</option><option value="7">PUK4_V3</option></select></label><label>角色<select id="serial" disabled></select></label><label>動作<select id="motion" disabled></select></label><button id="reload" disabled>重新載入／重試</button></div>
<div id="status" role="status">讀取資源版本…</div><div id="error" role="alert"></div>
<div class="stage-title"><strong id="selected">尚未選取方向</strong><span id="memory">共用 Bitmap 預算 32 MiB</span></div>
<div class="stage"><canvas id="canvas" width="960" height="480" aria-label="選取方向的大型動畫預覽"></canvas></div>
<div class="controls"><button id="play" disabled>播放全部方向</button><button id="previous" disabled>上一格</button><button id="next" disabled>下一格</button><label>同步影格<input id="frame" type="range" min="0" value="0" disabled></label><span id="position">尚未載入</span><label>適應畫面倍率<select id="zoom"><option value="0.5">50%</option><option value="1" selected>100%</option><option value="2">200%</option></select></label></div>
<p>點選方向切換大圖；左右方向鍵可切換縮圖。未提供或無法讀取的方向會明確標示。</p><div id="directions" role="group" aria-label="全部素材方向"></div>
</main></body></html>
