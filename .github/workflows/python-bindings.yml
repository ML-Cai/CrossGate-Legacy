name: CPU Python bindings
on:
  pull_request:
    branches: [develop]
    paths:
      - 'tools/python/**'
      - 'engines/src/map/**'
      - 'engines/src/assets/map_builder.*'
      - 'modules/assets/**'
      - 'modules/common/**'
      - 'modules/settings/**'
      - 'modules/trace/**'
      - 'modules/utils/**'
      - 'cmake/AddressSanitizer.cmake'
      - '.github/workflows/python-bindings.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bindings:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - id: python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.4.1
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          cmake -S tools/python/tests/headless -B build/python-headless -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}"
          if errorlevel 1 exit /b 1
          cmake --build build/python-headless --parallel 2
          if errorlevel 1 exit /b 1
          ctest --test-dir build/python-headless -V --no-tests=error --output-junit results.xml
          if errorlevel 1 exit /b 1
      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S tools/python/tests/headless -B build/python-headless -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}"
          cmake --build build/python-headless --parallel 2
          ctest --test-dir build/python-headless -V --no-tests=error --output-junit results.xml
      - name: Test diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: python-bindings-${{ matrix.os }}
          path: |
            build/python-headless/results.xml
            build/python-headless/Testing/Temporary/
          retention-days: 7
